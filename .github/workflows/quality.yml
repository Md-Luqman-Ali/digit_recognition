name: Quality checks

on:
  push:
    branches: ["main", "release-c/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q
      - run: python -m compileall -q .
